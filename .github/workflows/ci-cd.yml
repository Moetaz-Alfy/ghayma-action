name: CI - Build, Test, and Prepare Ghaymah Deployment



on:
  push:
    branches:
      - develop   # staging
      - main      # production
  workflow_dispatch: {}

env:
  IMAGE_NAME: motazelalfy/ghyma-cicd-demo

jobs:
  build-and-test:
    name: Build & Smoke-Test Docker Image
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record commit SHA (this is what you'll paste into Ghaymah)
        id: vars
        run: echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image (local, for smoke test)
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Smoke test - run container and check /health
        run: |
          docker run -d -p 3000:3000 --name smoke-test ${{ env.IMAGE_NAME }}:test
          sleep 3
          curl -f http://localhost:3000/health
          docker stop smoke-test
          docker rm smoke-test

  # ---------------------------------------------------------
  # STAGING - runs automatically after a successful build,
  # no approval needed. Since Ghaymah has no API/CLI yet, this
  # job cannot deploy for you - it prints the exact instructions
  # for updating the "mywebapp-stg" app in the Ghaymah dashboard.
  # ---------------------------------------------------------
  notify-staging:
    name: Staging deployment instructions
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Print deployment instructions
        run: |
          echo "================================================"
          echo " STAGING deployment ready"
          echo " Ghaymah dashboard -> Application: mywebapp-stg"
          echo " Set Branch/Commit SHA field to: ${{ needs.build-and-test.outputs.commit_sha }}"
          echo " Then click Save to trigger the redeploy."
          echo "================================================"

 
  notify-production:
    name: Production deployment instructions (manual approval required)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production   # <-- approval gate lives here
    steps:
      - name: Print deployment instructions
        run: |
          echo "================================================"
          echo " PRODUCTION deployment approved and ready"
          echo " Ghaymah dashboard -> Application: mywebapp-prod"
          echo " Set Branch/Commit SHA field to: ${{ needs.build-and-test.outputs.commit_sha }}"
          echo " Then click Save to trigger the redeploy."
          echo "================================================"
